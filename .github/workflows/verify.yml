name: فحص الجودة (أنواع + اختبارات)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: فحص الأنواع والاختبارات
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4
      - name: تهيئة pnpm
        uses: pnpm/action-setup@v4
      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile --prod=false
      - name: فحص الأنواع
        run: pnpm check
      - name: تشغيل الاختبارات
        run: pnpm test
      - name: ملخص النتيجة
        if: always()
        run: |
          echo "### نتيجة فحص الجودة" >> "$GITHUB_STEP_SUMMARY"
          echo "- النتيجة النهائية: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- المراجع: ${{ github.ref_name }} (${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
