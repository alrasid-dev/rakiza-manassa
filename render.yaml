services:
  - type: web
    name: rakiza-manassa
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_OWNER_EMAIL
        value: rakizaplatform@gmail.com
      - key: DATABASE_URL
        sync: false
